version: 2.1

# This branch holds a document, not a build, so the only thing worth checking is
# that the document still points at things that answer. Every URL in README.md
# must return a 2xx/3xx; anything else fails the build, which is what keeps the
# page from advertising a path that is not live yet.
jobs:
  links:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: The banner the README embeds is in the tree
          command: test -s banner.png
      - run:
          name: Every URL in README.md answers
          command: |
            fail=0

            # The Content Security Policy block lists hosts a page has to allow,
            # not links to follow, so it is dropped before collecting URLs.
            awk '/^```text$/{skip=1} !skip{print} /^```$/{skip=0}' README.md > /tmp/readme.md

            for url in $(grep -oE 'https?://[^ )"`<>]+' /tmp/readme.md | sort -u); do
              # Affiliate base the tracking attribute is appended to; it has no
              # page of its own.
              [ "$url" = "https://datacamp.pxf.io" ] && continue

              code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 20 "$url" || echo 000)
              case "$code" in
                2*|3*) echo "ok   $code $url" ;;
                *)     echo "DEAD $code $url"; fail=1 ;;
              esac
            done

            exit $fail

workflows:
  links:
    jobs:
      - links
