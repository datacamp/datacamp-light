version: 2.1

jobs:
  build:
    docker:
      - image: node:8.9.1
    steps:
      - checkout
      - run:
          name: Install node deps and build
          command: |
            npm install
            if [ "$CIRCLE_BRANCH" == 'development' ]; then
              NODE_WORKSPACE=PRODDUCTION npm run build:dev
            else
              NODE_WORKSPACE=PRODDUCTION npm run build:prod
            fi
            gzip dist/dcl-react.js
      - run:
          name: Run Tests
          environment:
            JEST_JUNIT_OUTPUT: reports/junit/js-test-results.xml
          command: |
            npm run test:ci
      - run:
          name: Run Linter
          command: |
            npm run lint:ci
      - store_test_results:
          path: reports/junit
      - persist_to_workspace:
          root: "."
          paths:
            - dist/*
            - docs/*
workflows:
  build_and_deploy:
    jobs:
      - build:
          context: org-global
          filters:
            tags:
              only: /.*/
